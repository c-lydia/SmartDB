[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartdb-ingestion"
version = "0.1.0"
description = "SmartDB CoAP/CBOR device ingestion gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiocoap>=0.4.12,<0.5",
  "cbor2>=5.6,<6",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
smartdb-ingestion = "smartdb_ingestion.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdb_ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
