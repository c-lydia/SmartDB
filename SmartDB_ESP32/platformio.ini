; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Upload settings
upload_port = COM3
upload_speed = 921600

; Serial monitor settings
monitor_speed = 115200

; Monitor settings for newer ESP32 boards
monitor_rts = 0
monitor_dtr = 0

; Build flags
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Libraries (you'll add more later)
lib_deps =
    firebase-arduino-master
