[platformio]
default_envs = smartdb_s3
src_dir = main

[env]
platform = espressif32@7.0.1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = partitions.csv

[env:smartdb_s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.defaults.esp32s3

[env:smartdb_s3_demo]
extends = env:smartdb_s3
build_flags = -DSMARTDB_DEMO=1

[env:esp32cam]
board = esp32cam
board_build.sdkconfig_defaults = sdkconfig.defaults,sdkconfig.defaults.esp32
